<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endgame — Play Chess</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="table">

  <header class="masthead">
    <div class="masthead-mark">♞</div>
    <div class="masthead-text">
      <h1>Endgame</h1>
      <p class="masthead-sub">A quiet board for a slow game.</p>
    </div>
    <div class="whoami">
      <span class="whoami-label">Playing as</span>
      <button id="usernameBtn" class="whoami-name">…</button>
    </div>
  </header>

  <main class="layout">

    <section class="board-wrap">
      <div class="board-frame">
        <div class="files-row files-top" aria-hidden="true"></div>
        <div class="board-and-ranks">
          <div class="ranks-col" aria-hidden="true"></div>
          <div id="board" class="board" role="grid" aria-label="Chess board"></div>
          <div class="ranks-col ranks-col-right" aria-hidden="true"></div>
        </div>
        <div class="files-row files-bottom" aria-hidden="true"></div>
      </div>

      <div class="status-bar">
        <div id="status" class="status" aria-live="polite">White to move</div>
        <div class="controls">
          <button id="newGameBtn" class="btn btn-primary">New game</button>
          <button id="undoBtn" class="btn">Undo</button>
          <button id="flipBtn" class="btn">Flip board</button>
        </div>
      </div>
    </section>

    <aside class="sidebar">

      <div class="panel mode-panel">
        <h2 class="panel-title">Opponent</h2>
        <div class="mode-toggle" id="modeToggle">
          <button class="mode-option active" data-mode="two-player">Two players</button>
          <button class="mode-option" data-mode="computer">Vs. computer</button>
          <button class="mode-option" data-mode="online">Online</button>
        </div>
        <div class="mode-toggle difficulty-toggle hidden" id="difficultyToggle">
          <button class="mode-option" data-difficulty="easy">Easy</button>
          <button class="mode-option active" data-difficulty="medium">Medium</button>
          <button class="mode-option" data-difficulty="hard">Hard</button>
        </div>

        <div class="online-panel hidden" id="onlinePanel">

          <div id="onlineLobby" class="online-block">
            <div class="online-row">
              <button id="createRoomBtn" class="btn btn-primary btn-block">Create room</button>
            </div>
            <div class="online-divider">or</div>
            <div class="online-row online-join-row">
              <input id="joinRoomInput" class="text-input" maxlength="5" placeholder="Room code" autocomplete="off">
              <button id="joinRoomBtn" class="btn">Join</button>
            </div>
            <p id="onlineError" class="online-error hidden"></p>
          </div>

          <div id="onlineActive" class="online-block hidden">
            <div class="room-code-row">
              <span class="room-code-label">Room</span>
              <span id="roomCodeDisplay" class="room-code"></span>
            </div>
            <p id="onlineStatusText" class="online-status-text">Waiting for an opponent…</p>
            <button id="leaveRoomBtn" class="btn btn-danger btn-block">Leave / Resign</button>
          </div>

        </div>
      </div>

      <div class="panel leaderboard-panel">
        <h2 class="panel-title">Leaderboard</h2>
        <ol id="leaderboardList" class="leaderboard-list"></ol>
      </div>

      <div class="panel captures-panel">
        <h2 class="panel-title">Captured</h2>
        <div class="captures-row">
          <span class="captures-label">White has taken</span>
          <div id="capturedByWhite" class="captured-pieces"></div>
        </div>
        <div class="captures-row">
          <span class="captures-label">Black has taken</span>
          <div id="capturedByBlack" class="captured-pieces"></div>
        </div>
      </div>

      <div class="panel moves-panel">
        <h2 class="panel-title">Moves</h2>
        <ol id="moveList" class="move-list"></ol>
      </div>

    </aside>

  </main>

  <div id="promoModal" class="modal hidden">
    <div class="modal-card">
      <p class="modal-title">Promote your pawn</p>
      <div id="promoChoices" class="promo-choices"></div>
    </div>
  </div>

  <div id="usernameModal" class="modal hidden">
    <div class="modal-card">
      <p class="modal-title">Choose a username</p>
      <p class="modal-sub">This name appears on the global leaderboard.</p>
      <input id="usernameInput" class="text-input" maxlength="18" placeholder="Your name" autocomplete="off">
      <p id="usernameError" class="online-error hidden"></p>
      <button id="usernameSaveBtn" class="btn btn-primary btn-block">Save</button>
    </div>
  </div>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
